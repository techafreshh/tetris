<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tetris</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #app {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 16px;
      }
      #center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #board {
        border: 1px solid #555;
        background: #000;
      }
      .side-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 110px;
      }
      .side-panel h2 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 3px;
        color: #aaa;
      }
      #hold-slot,
      #next-queue {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 72px;
        border: 1px solid #555;
        background: #000;
        padding: 6px;
      }
      #hold-slot {
        min-height: 40px;
        align-items: center;
        justify-content: center;
      }
      #hold-slot:empty::after {
        content: "—";
        color: #555;
      }
      #next-queue {
        min-height: 200px;
      }
      .piece {
        font-family: ui-monospace, monospace;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        line-height: 1.4;
      }
      #stats {
        display: flex;
        flex-direction: row;
        gap: 16px;
        font-size: 14px;
        color: #ccc;
      }
      #stats[hidden] {
        display: none;
      }
      #event-text {
        min-height: 20px;
        font-size: 14px;
        letter-spacing: 3px;
        color: #ffd75e;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10;
        pointer-events: none;
      }
      #overlay[hidden] {
        display: none;
      }
      #stats .label {
        color: #888;
        font-size: 11px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="side-panel" aria-label="hold">
        <h2>HOLD</h2>
        <div id="hold-slot"></div>
      </aside>
      <div id="center">
        <canvas id="board" width="240" height="400">press any key</canvas>
        <div id="stats" hidden>
          <div><span class="label">SCORE</span> <span id="score">0</span></div>
          <div><span class="label">LINES</span> <span id="lines">0</span></div>
          <div><span class="label">LEVEL</span> <span id="level">1</span></div>
        </div>
        <div id="event-text" aria-live="polite"></div>
        <p>press any key</p>
      </div>
      <aside class="side-panel" aria-label="next">
        <h2>NEXT</h2>
        <div id="next-queue"></div>
      </aside>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
