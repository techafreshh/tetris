name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: deploy readiness
        run: |
          test -f dist/index.html
          grep -q '<div id="app">' dist/index.html
          grep -q '<canvas' dist/index.html
          grep -q 'next-queue' dist/index.html
          grep -q 'id="score"' dist/index.html
          grep -q 'dist' wrangler.toml
